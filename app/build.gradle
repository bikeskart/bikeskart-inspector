plugins { id 'com.android.application' }
android {
 namespace 'com.bikeskart.inspector'
 compileSdk 35
 defaultConfig {
  applicationId 'com.bikeskart.inspector'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '0.1.0'
  buildConfigField 'String', 'API_BASE_URL', '"https://auction.bikeskart.com/api/inspector/"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
